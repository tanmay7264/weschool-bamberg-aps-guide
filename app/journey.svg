<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="flowtitle flowdesc">
<title id="flowtitle">APS Process A responsibilities and flow</title><desc id="flowdesc">Selection goes to institutional route confirmation. A confirmed exemption goes to visa preparation. Otherwise nomination and group arrangements run together, then student documents, account, form and signing, followed by collective payment, dispatch, APS verification and the German host university result confirmation. Missing documents and additional requests return to document preparation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="var(--color-text-secondary)"/></marker></defs>
<style>text{font-family:var(--font-family-body);fill:var(--color-text-primary)}.lane{fill:var(--color-background-muted)}.node{fill:var(--color-background-surface);stroke:var(--color-border-emphasized);stroke-width:1.4}.inst{fill:var(--color-background-surface);stroke:var(--color-accent)}.gate{fill:var(--color-background-muted);stroke:var(--color-text-warning)}.line{fill:none;stroke:var(--color-text-secondary);stroke-width:1.6;marker-end:url(#arrow)}.small{font-size:var(--text-supporting-size);fill:var(--color-text-secondary)}.label{font-size:var(--text-body-size);font-weight:600}.heading{font-size:var(--text-body-size);font-weight:700;letter-spacing:.06em}</style>
